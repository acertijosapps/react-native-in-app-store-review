<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <symbol id="star" viewBox="0 0 24 24">
      <path d="M12 2l2.95 5.98 6.6.96-4.77 4.65 1.13 6.57L12 17.02 6.09 20.13l1.13-6.57L2.45 8.94l6.6-.96z"/>
    </symbol>
    <linearGradient id="appIcon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3e"/>
      <stop offset="0.5" stop-color="#6b6b70"/>
      <stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <linearGradient id="galaxyFrame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset="0.5" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#1c1c20"/>
    </linearGradient>
    <clipPath id="iScreen"><rect x="9" y="9" width="222" height="512" rx="40"/></clipPath>
    <clipPath id="aScreen"><rect x="7" y="7" width="226" height="516" rx="34"/></clipPath>
  </defs>

  <rect x="0" y="0" width="820" height="640" rx="24" fill="url(#bg)"/>

  <!-- ==================== iPhone 17 ==================== -->
  <g transform="translate(110,46)">
    <!-- side buttons -->
    <rect x="-3" y="118" width="4" height="26" rx="2" fill="#5a5a5e"/>
    <rect x="-3" y="158" width="4" height="42" rx="2" fill="#5a5a5e"/>
    <rect x="-3" y="212" width="4" height="42" rx="2" fill="#5a5a5e"/>
    <rect x="239" y="176" width="4" height="64" rx="2" fill="#5a5a5e"/>
    <!-- titanium frame -->
    <rect x="0" y="0" width="240" height="530" rx="48" fill="url(#titanium)"/>
    <!-- inner body -->
    <rect x="5" y="5" width="230" height="520" rx="44" fill="#0b0b0f"/>
    <!-- screen -->
    <rect x="9" y="9" width="222" height="512" rx="40" fill="#eef0f4"/>

    <g clip-path="url(#iScreen)">
      <!-- faint app content -->
      <g opacity="0.35" fill="#c7ccd6">
        <rect x="30" y="60" width="130" height="14" rx="7"/>
        <rect x="30" y="88" width="180" height="10" rx="5"/>
        <rect x="30" y="106" width="150" height="10" rx="5"/>
        <rect x="30" y="136" width="180" height="70" rx="12"/>
      </g>
      <!-- dim overlay -->
      <rect x="9" y="9" width="222" height="512" fill="#0b1220" opacity="0.30"/>
      <!-- alert -->
      <rect x="27" y="170" width="186" height="216" rx="20" fill="#ffffff"/>
      <rect x="94" y="192" width="52" height="52" rx="13" fill="url(#appIcon)"/>
      <use href="#star" x="108" y="206" width="24" height="24" fill="#ffffff"/>
      <text x="120" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Enjoying Your App?</text>
      <text x="120" y="292" text-anchor="middle" font-size="11" fill="#6b7280">Tap a star to rate it on</text>
      <text x="120" y="307" text-anchor="middle" font-size="11" fill="#6b7280">the App Store</text>
      <g fill="#f5a623">
        <use href="#star" x="42"  y="320" width="24" height="24"/>
        <use href="#star" x="71"  y="320" width="24" height="24"/>
        <use href="#star" x="100" y="320" width="24" height="24"/>
        <use href="#star" x="129" y="320" width="24" height="24"/>
        <use href="#star" x="158" y="320" width="24" height="24"/>
      </g>
      <line x1="27" y1="352" x2="213" y2="352" stroke="#e5e7eb" stroke-width="1"/>
      <text x="120" y="369" text-anchor="middle" font-size="13" font-weight="600" fill="#0a84ff">Not Now</text>
    </g>

    <!-- Dynamic Island -->
    <rect x="82" y="22" width="76" height="24" rx="12" fill="#000000"/>

    <text x="120" y="566" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">iOS</text>
    <text x="120" y="586" text-anchor="middle" font-size="11.5" fill="#94a3b8">SKStoreReviewController</text>
  </g>

  <!-- ==================== Galaxy S26 ==================== -->
  <g transform="translate(470,46)">
    <!-- side buttons (right) -->
    <rect x="239" y="150" width="4" height="38" rx="2" fill="#5a5a5e"/>
    <rect x="239" y="198" width="4" height="66" rx="2" fill="#5a5a5e"/>
    <!-- frame -->
    <rect x="0" y="0" width="240" height="530" rx="42" fill="url(#galaxyFrame)"/>
    <!-- inner body -->
    <rect x="4" y="4" width="232" height="522" rx="39" fill="#0b0b0f"/>
    <!-- screen (ultra-thin symmetric bezels) -->
    <rect x="7" y="7" width="226" height="516" rx="34" fill="#f6f7f9"/>

    <g clip-path="url(#aScreen)">
      <!-- faint app content -->
      <g opacity="0.35" fill="#c7ccd6">
        <rect x="30" y="58" width="130" height="14" rx="7"/>
        <rect x="30" y="86" width="180" height="10" rx="5"/>
        <rect x="30" y="104" width="150" height="10" rx="5"/>
      </g>
      <!-- scrim -->
      <rect x="7" y="7" width="226" height="516" fill="#0b1220" opacity="0.30"/>

      <!-- bottom sheet -->
      <rect x="7" y="312" width="226" height="211" rx="26" fill="#ffffff"/>
      <rect x="98" y="326" width="44" height="5" rx="2.5" fill="#d1d5db"/>

      <!-- Google Play logo -->
      <g transform="translate(30,348)">
        <path d="M0 0 L16 8 L0 16 Z" fill="#00c4b3"/>
        <path d="M0 0 L9 4.5 L2.5 8 Z" fill="#00e0ff" opacity="0.9"/>
        <path d="M0 16 L9 11.5 L2.5 8 Z" fill="#ffd400" opacity="0.9"/>
      </g>
      <text x="56" y="361" font-size="12.5" font-weight="600" fill="#3c4043">Google Play</text>

      <!-- app row -->
      <rect x="30" y="380" width="44" height="44" rx="12" fill="url(#appIcon)"/>
      <use href="#star" x="43" y="393" width="18" height="18" fill="#ffffff"/>
      <text x="86" y="399" font-size="14" font-weight="700" fill="#202124">Your App</text>
      <text x="86" y="417" font-size="11" fill="#5f6368">Rate this app</text>

      <!-- stars -->
      <g fill="#01875f">
        <use href="#star" x="38"  y="442" width="30" height="30"/>
        <use href="#star" x="78"  y="442" width="30" height="30"/>
        <use href="#star" x="118" y="442" width="30" height="30"/>
        <use href="#star" x="158" y="442" width="30" height="30"/>
      </g>
      <use href="#star" x="198" y="442" width="30" height="30" fill="none" stroke="#c0c4c9" stroke-width="1.5"/>
    </g>

    <!-- centered punch-hole camera -->
    <circle cx="120" cy="24" r="6" fill="#000000"/>

    <text x="120" y="566" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">Android</text>
    <text x="120" y="586" text-anchor="middle" font-size="11.5" fill="#94a3b8">Play In-App Review</text>
  </g>

  <text x="410" y="305" text-anchor="middle" font-size="20" fill="#475569" font-weight="700">·</text>
</svg>
